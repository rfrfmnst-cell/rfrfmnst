name: Rafraf API readiness and database tests
on:
  pull_request:
    paths:
      - 'sites/api.rfrf.net/**'
      - 'scripts/verify-site.mjs'
      - '.github/workflows/rafraf-api-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.6.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
        working-directory: sites/api.rfrf.net
      - run: node scripts/verify-site.mjs api.rfrf.net
      - run: pnpm test:database
        working-directory: sites/api.rfrf.net
      - run: node --test supabase/tests/*.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rafraf-api-verification
          path: outputs/verification/api.rfrf.net/
          retention-days: 7
