name: Rafraf hourly public review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rafraf-hourly-review.yml
      - scripts/qa-public-sites.mjs
      - scripts/qa-public-sites.test.mjs
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rafraf-public-review
  cancel-in-progress: false

jobs:
  public-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate monitor decisions
        run: node --test scripts/qa-public-sites.test.mjs
      - name: Review public pages without production writes
        run: node scripts/qa-public-sites.mjs
      - name: Save Arabic report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rafraf-review-${{ github.run_id }}
          path: outputs/hourly-review/
          if-no-files-found: warn
          retention-days: 7
