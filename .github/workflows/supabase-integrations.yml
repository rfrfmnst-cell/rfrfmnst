name: Supabase integration tests

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'sites/rfrf.net/apps/customer/lib/payments/**'
      - 'sites/admin.rfrf.net/apps/admin/lib/shipping/**'
      - '.github/workflows/supabase-integrations.yml'
  push:
    paths:
      - 'supabase/**'
      - 'sites/rfrf.net/apps/customer/lib/payments/**'
      - 'sites/admin.rfrf.net/apps/admin/lib/shipping/**'
      - '.github/workflows/supabase-integrations.yml'

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test supabase/tests/*.test.mjs
